<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SurgiGuard AI — Test Lab D2A</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1a2235;
      --border: #1e2d45;
      --border2: #243552;
      --primary: #3b82f6;
      --primary-dim: #1d4ed8;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --purple: #8b5cf6;
      --text: #f1f5f9;
      --muted: #64748b;
      --muted2: #94a3b8;
      --safe: #10b981;
      --warning: #f59e0b;
      --blocked: #ef4444;
      --glow-blue: 0 0 40px rgba(59,130,246,0.15);
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Animated gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,0.07) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

    /* Header */
    .header { text-align: center; margin-bottom: 40px; padding: 40px 20px; }
    .header-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3);
      border-radius: 99px; padding: 6px 16px; margin-bottom: 20px;
      font-size: 12px; font-weight: 600; color: var(--primary); letter-spacing: 1px; text-transform: uppercase;
    }
    .header h1 { font-size: 42px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 12px; }
    .header h1 span { background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: var(--muted2); font-size: 16px; max-width: 500px; margin: 0 auto; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; margin-bottom: 32px; }
    .tab { flex: 1; padding: 10px; border-radius: 12px; border: none; background: transparent; color: var(--muted2); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tab.active { background: var(--surface2); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .tab:hover:not(.active) { color: var(--text); }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border2); }
    .card-title { font-size: 13px; font-weight: 700; color: var(--muted2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .card-title .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

    /* API URL config */
    .api-config { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .api-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .api-url-input { flex: 1; background: transparent; border: none; color: var(--muted2); font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; }

    /* Form elements */
    .field { margin-bottom: 16px; }
    .label { font-size: 12px; font-weight: 600; color: var(--muted2); margin-bottom: 8px; display: block; letter-spacing: 0.5px; text-transform: uppercase; }
    .input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
      padding: 12px 14px; outline: none; transition: border-color 0.2s;
    }
    .input:focus { border-color: var(--primary); }
    .input::placeholder { color: var(--muted); }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border2); border-radius: var(--radius); padding: 48px 24px;
      text-align: center; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--primary); background: rgba(59,130,246,0.05); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-icon { font-size: 40px; margin-bottom: 12px; }
    .upload-zone h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .upload-zone p { color: var(--muted); font-size: 13px; }
    .file-selected { background: rgba(59,130,246,0.1); border-color: var(--primary); }
    .file-name { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 8px; }

    /* Tags */
    .tags-input { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
    .tag { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .tag-remove { cursor: pointer; opacity: 0.7; } .tag-remove:hover { opacity: 1; }
    .tags-input-field { border: none; background: transparent; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; outline: none; flex: 1; min-width: 120px; }
    .tags-input-field::placeholder { color: var(--muted); }

    /* Buttons */
    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none; font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #6366f1); color: white; box-shadow: 0 4px 20px rgba(59,130,246,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59,130,246,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 20px rgba(16,185,129,0.3); }
    .btn-green:hover { transform: translateY(-1px); }
    .btn-green:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status badge */
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px;
      border-radius: 99px; font-size: 14px; font-weight: 800; letter-spacing: 0.5px;
    }
    .status-SAFE { background: rgba(16,185,129,0.15); border: 1.5px solid var(--safe); color: var(--safe); }
    .status-WARNING { background: rgba(245,158,11,0.15); border: 1.5px solid var(--warning); color: var(--warning); }
    .status-BLOCKED { background: rgba(239,68,68,0.15); border: 1.5px solid var(--blocked); color: var(--blocked); }
    .status-ERROR { background: rgba(100,116,139,0.15); border: 1.5px solid var(--muted); color: var(--muted2); }
    .status-EMERGENCY { background: rgba(239,68,68,0.2); border: 1.5px solid var(--blocked); color: var(--blocked); }
    .status-OK { background: rgba(16,185,129,0.15); border: 1.5px solid var(--safe); color: var(--safe); }

    /* Results */
    .result-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .result-meta { flex: 1; }
    .result-patient { font-size: 20px; font-weight: 800; }
    .result-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .meds-grid { display: grid; gap: 10px; }
    .med-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; align-items: flex-start; gap: 14px; }
    .med-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .med-name { font-weight: 700; font-size: 15px; }
    .med-detail { color: var(--muted2); font-size: 12px; margin-top: 3px; }
    .confidence-bar { height: 4px; border-radius: 99px; background: var(--border); margin-top: 8px; overflow: hidden; }
    .confidence-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #3b82f6, #10b981); transition: width 0.6s ease; }

    .alert-card { border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
    .alert-CRITICAL, .alert-EMERGENCY { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
    .alert-WARNING { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
    .alert-INFO { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); }
    .alert-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
    .alert-text { font-size: 13px; line-height: 1.6; color: var(--muted2); }

    /* JSON viewer */
    .json-viewer { background: #0d1117; border: 1px solid var(--border); border-radius: 12px; padding: 20px; overflow: auto; max-height: 500px; }
    .json-viewer pre { font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; }
    .json-download-btn { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); margin-bottom: 12px; transition: all 0.2s; width: fit-content; }
    .json-download-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Slider range */
    .range-container { margin-bottom: 16px; }
    .range-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .range-value { font-size: 20px; font-weight: 800; }
    input[type=range] { width: 100%; height: 6px; border-radius: 99px; appearance: none; background: var(--border); outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

    /* Chips */
    .chips-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border-radius: 99px; border: 1.5px solid var(--border2); background: transparent; color: var(--muted2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
    .chip.on { border-color: var(--primary); background: rgba(59,130,246,0.15); color: var(--primary); }
    .chip.danger.on { border-color: var(--red); background: rgba(239,68,68,0.15); color: #fca5a5; }

    /* Score ring */
    .score-ring { position: relative; width: 100px; height: 100px; }
    .score-ring svg { transform: rotate(-90deg); }
    .score-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .score-val { font-size: 28px; font-weight: 800; }
    .score-sub { font-size: 10px; color: var(--muted); font-weight: 600; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-val { font-size: 14px; font-weight: 700; }

    .section-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    .restriction-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; background: var(--surface2); border-radius: 10px; margin-bottom: 8px; font-size: 13px; }
    .restriction-icon { font-size: 16px; flex-shrink: 0; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback } = React;

const API_DEFAULT = "http://localhost:8000";

// ── Helpers ──────────────────────────────────────────────────────────────
function colorForScore(v) {
  if (v >= 75) return "#10b981";
  if (v >= 45) return "#f59e0b";
  return "#ef4444";
}

function ScoreRing({ value }) {
  const r = 40, c = 50, circ = 2 * Math.PI * r;
  const fill = (value / 100) * circ;
  const color = colorForScore(value);
  return (
    <div className="score-ring">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx={c} cy={c} r={r} fill="none" stroke="#1e2d45" strokeWidth="9" />
        <circle cx={c} cy={c} r={r} fill="none" stroke={color} strokeWidth="9"
          strokeDasharray={`${fill} ${circ}`} strokeLinecap="round"
          style={{ transition: "stroke-dasharray 0.6s ease" }} />
      </svg>
      <div className="score-center">
        <div className="score-val" style={{ color }}>{value}</div>
        <div className="score-sub">/ 100</div>
      </div>
    </div>
  );
}

function JsonViewer({ data }) {
  const json = JSON.stringify(data, null, 2);
  const download = () => {
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url;
    a.download = "surgiguard_extraction.json"; a.click();
    URL.revokeObjectURL(url);
  };
  const colorize = (str) => str
    .replace(/"(status|dci|document_type|patient_lastname|patient_firstname|severity|code)":/g, '<span style="color:#8b5cf6">$&</span>')
    .replace(/"(SAFE|OK)"/g, '<span style="color:#10b981">$&</span>')
    .replace(/"(WARNING)"/g, '<span style="color:#f59e0b">$&</span>')
    .replace(/"(BLOCKED|EMERGENCY|CRITICAL)"/g, '<span style="color:#ef4444">$&</span>')
    .replace(/"([^"]+)":/g, '<span style="color:#7dd3fc">$&</span>')
    .replace(/: "([^"]+)"/g, ': <span style="color:#86efac">"$1"</span>')
    .replace(/: (true|false)/g, ': <span style="color:#f472b6">$1</span>')
    .replace(/: ([\d.]+)/g, ': <span style="color:#fbbf24">$1</span>');
  return (
    <div>
      <button className="json-download-btn" onClick={download}>⬇ Télécharger JSON (pour votre amie RAG)</button>
      <div className="json-viewer"><pre dangerouslySetInnerHTML={{ __html: colorize(json) }} /></div>
    </div>
  );
}

// ── Tab 1: Document Upload ─────────────────────────────────────────────
function UploadTab({ apiUrl }) {
  const [file, setFile] = useState(null);
  const [allergies, setAllergies] = useState(["pénicilline"]);
  const [allergyInput, setAllergyInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [drag, setDrag] = useState(false);
  const fileRef = useRef();

  const addAllergy = (e) => {
    if ((e.key === "Enter" || e.key === ",") && allergyInput.trim()) {
      e.preventDefault();
      setAllergies(a => [...a, allergyInput.trim()]);
      setAllergyInput("");
    }
  };

  const analyze = async () => {
    if (!file) return;
    setLoading(true); setError(null); setResult(null);
    const fd = new FormData();
    fd.append("file", file);
    fd.append("patient_allergies", allergies.join(","));
    try {
      const res = await fetch(`${apiUrl}/v1/documents/upload`, { method: "POST", body: fd });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      setResult(await res.json());
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  const med = result?.extraction;
  const safety = result?.safety_report;

  const medColors = ["#3b82f6","#8b5cf6","#10b981","#f59e0b","#ef4444","#06b6d4"];

  return (
    <div>
      {/* Upload zone */}
      <div className="card">
        <div className="card-title"><span className="dot" />Charger le Dossier Médical PDF</div>
        <div
          className={`upload-zone ${file ? "file-selected" : ""} ${drag ? "drag" : ""}`}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if (f?.type === "application/pdf") setFile(f); }}
          onClick={() => fileRef.current.click()}
        >
          <input ref={fileRef} type="file" accept=".pdf" onChange={e => setFile(e.target.files[0])} style={{display:'none'}} />
          <div className="upload-icon">{file ? "📄" : "📂"}</div>
          {file ? (
            <>
              <h3 style={{color:"var(--primary)"}}>Fichier sélectionné ✓</h3>
              <div className="file-name">{file.name} ({(file.size/1024).toFixed(1)} KB)</div>
            </>
          ) : (
            <>
              <h3>Déposez votre PDF ici</h3>
              <p>Ordonnance, compte-rendu opératoire, lettre de sortie…</p>
            </>
          )}
        </div>
      </div>

      {/* Allergies */}
      <div className="card">
        <div className="card-title"><span className="dot" style={{background:"#ef4444"}} />Allergies Connues du Patient</div>
        <p style={{color:"var(--muted)",fontSize:13,marginBottom:12}}>Tapez une allergie et appuyez sur Entrée pour l'ajouter</p>
        <div className="tags-input">
          {allergies.map((a, i) => (
            <span key={i} className="tag">
              ⚠ {a}
              <span className="tag-remove" onClick={() => setAllergies(al => al.filter((_,j)=>j!==i))}>✕</span>
            </span>
          ))}
          <input className="tags-input-field" value={allergyInput}
            onChange={e => setAllergyInput(e.target.value)}
            onKeyDown={addAllergy}
            placeholder="ex: aspirine, pénicilline..." />
        </div>
      </div>

      <button className="btn btn-primary" onClick={analyze} disabled={!file || loading}>
        {loading ? <><div className="spinner" /> Analyse IA en cours...</> : "🔬 Lancer le Pipeline AI"}
      </button>

      {error && (
        <div className="alert-card alert-CRITICAL" style={{marginTop:16}}>
          <div className="alert-icon">❌</div>
          <div>
            <div style={{fontWeight:700,marginBottom:4}}>Erreur de connexion</div>
            <div className="alert-text">{error}</div>
            <div className="alert-text" style={{marginTop:8}}>Vérifiez que le serveur tourne sur <code style={{color:"var(--primary)"}}>{apiUrl}</code></div>
          </div>
        </div>
      )}

      {result && (
        <>
          {/* Result header */}
          <div className="card" style={{marginTop:24}}>
            <div className="result-header">
              <div className="result-meta">
                <div className="result-patient">
                  {med?.patient_firstname} {med?.patient_lastname}
                </div>
                <div className="result-sub">
                  {med?.document_type?.replace(/_/g," ").toUpperCase()} · {med?.prescriber} · {med?.prescription_date}
                </div>
                <div style={{marginTop:8,display:"flex",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:12,color:"var(--muted)"}}>OCR:</span>
                  <span style={{fontSize:12,fontFamily:"'JetBrains Mono',monospace",color:"var(--primary)"}}>{result.ocr_method} · {result.word_count} mots</span>
                  <span style={{fontSize:12,color:"var(--muted)"}}>Confiance:</span>
                  <span style={{fontSize:12,color:"var(--green)",fontWeight:700}}>{Math.round((med?.global_confidence||0)*100)}%</span>
                </div>
              </div>
              <div className={`status-badge status-${result.status}`}>
                {result.status === "SAFE" && "✅"} {result.status === "WARNING" && "⚠️"} {result.status === "BLOCKED" && "🚨"} {result.status}
              </div>
            </div>

            {/* Allergies from doc */}
            {med?.known_allergies?.length > 0 && (
              <div style={{marginBottom:16}}>
                <div className="section-title">Allergies (document)</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {med.known_allergies.map((a,i) => <span key={i} className="tag">⚠ {a}</span>)}
                </div>
              </div>
            )}

            {/* Medications */}
            {med?.medications?.length > 0 && (
              <>
                <div className="section-title">Médicaments extraits ({med.medications.length})</div>
                <div className="meds-grid">
                  {med.medications.map((m, i) => (
                    <div key={i} className="med-card">
                      <div className="med-icon" style={{background:`${medColors[i%medColors.length]}22`,color:medColors[i%medColors.length]}}>💊</div>
                      <div style={{flex:1}}>
                        <div className="med-name">{m.dci} {m.dosage_raw || ""}</div>
                        {m.commercial_name && <div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>= {m.commercial_name}</div>}
                        <div className="med-detail">
                          {[m.frequency_raw, m.duration_days && `${m.duration_days}j`, m.route, m.drug_class].filter(Boolean).join(" · ")}
                        </div>
                        {m.special_instructions && <div style={{fontSize:11,color:"var(--yellow)",marginTop:4}}>📌 {m.special_instructions}</div>}
                        <div className="confidence-bar"><div className="confidence-fill" style={{width:`${(m.confidence||0)*100}%`}} /></div>
                        <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>{Math.round((m.confidence||0)*100)}% confiance</div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* Restrictions */}
            {med?.physical_restrictions?.length > 0 && (
              <>
                <div className="section-title">Restrictions physiques</div>
                {med.physical_restrictions.map((r,i) => (
                  <div key={i} className="restriction-item"><span className="restriction-icon">🚫</span>{r}</div>
                ))}
              </>
            )}

            {/* Appointments */}
            {med?.followup_appointments?.length > 0 && (
              <>
                <div className="section-title">Rendez-vous de suivi</div>
                {med.followup_appointments.map((a,i) => (
                  <div key={i} className="restriction-item"><span className="restriction-icon">📅</span>{a.description} — <strong>{a.timing}</strong></div>
                ))}
              </>
            )}
          </div>

          {/* Safety alerts */}
          {safety?.alerts?.length > 0 && (
            <div className="card">
              <div className="card-title"><span className="dot" style={{background:"var(--yellow)"}} />Rapport de Sécurité</div>
              {safety.alerts.map((a, i) => (
                <div key={i} className={`alert-card alert-${a.severity}`}>
                  <div className="alert-icon">{a.severity === "CRITICAL" ? "🚨" : a.severity === "WARNING" ? "⚠️" : "ℹ️"}</div>
                  <div>
                    <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>[{a.severity}] {a.code || ""}</div>
                    <div className="alert-text">{a.message}</div>
                    {a.recommendation && <div style={{marginTop:6,fontSize:12,color:"var(--primary)"}}>→ {a.recommendation}</div>}
                  </div>
                </div>
              ))}
              {safety.llm_analysis && (
                <div style={{marginTop:12,padding:"12px 14px",background:"var(--surface2)",borderRadius:10,fontSize:13,color:"var(--muted2)",lineHeight:1.6}}>
                  <strong style={{color:"var(--text)"}}>Analyse LLM :</strong><br/>{safety.llm_analysis}
                </div>
              )}
            </div>
          )}

          {/* JSON pour amie RAG */}
          <div className="card">
            <div className="card-title"><span className="dot" style={{background:"var(--purple)"}} />JSON Complet — Pour votre amie (Cerveau RAG)</div>
            <JsonViewer data={result} />
          </div>
        </>
      )}
    </div>
  );
}

// ── Tab 2: Daily Check-in ─────────────────────────────────────────────
function CheckInTab({ apiUrl }) {
  const [pain, setPain] = useState(3);
  const [fatigue, setFatigue] = useState(4);
  const [mobility, setMobility] = useState(6);
  const [wound, setWound] = useState([]);
  const [other, setOther] = useState([]);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);

  const woundOptions = ["redness","swelling","drainage","warmth","odor"];
  const woundLabels  = ["Rougeur","Gonflement","Écoulement","Chaleur","Mauvaise odeur"];
  const otherOptions = ["chills","fever","nausea","vomiting","shortness_of_breath","calf_pain"];
  const otherLabels  = ["Frissons","Fièvre","Nausées","Vomissements","Essoufflement 🚨","Douleur mollet 🚨"];
  const dangerIdx    = [4, 5];

  const toggle = (arr, setArr, v) => setArr(a => a.includes(v) ? a.filter(x=>x!==v) : [...a, v]);

  const submit = async () => {
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await fetch(`${apiUrl}/v1/checkin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ patient_id: "sarah_miller", pain, fatigue, mobility, wound_symptoms: wound, other_symptoms: other })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      setResult(await res.json());
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  const Slider = ({ label, value, set, color }) => (
    <div className="range-container">
      <div className="range-header">
        <div className="label" style={{margin:0}}>{label}</div>
        <div className="range-value" style={{color}}>{value}<span style={{fontSize:14,color:"var(--muted)",fontWeight:400}}>/10</span></div>
      </div>
      <input type="range" min={0} max={10} value={value} onChange={e => set(+e.target.value)}
        style={{'--thumb-color': color}} />
      <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
        <span style={{fontSize:11,color:"var(--muted)"}}>0 · Aucun</span>
        <span style={{fontSize:11,color:"var(--muted)"}}>10 · Sévère</span>
      </div>
    </div>
  );

  return (
    <div>
      <div className="card">
        <div className="card-title"><span className="dot" style={{background:"var(--yellow)"}} />Patient — Sarah Miller · J+6 post-PTG</div>
        <Slider label="Douleur (EVA)" value={pain} set={setPain} color={pain>=7?"#ef4444":pain>=4?"#f59e0b":"#10b981"} />
        <Slider label="Fatigue" value={fatigue} set={setFatigue} color={fatigue>=7?"#ef4444":fatigue>=4?"#f59e0b":"#10b981"} />
        <Slider label="Mobilité" value={mobility} set={setMobility} color={mobility<=3?"#ef4444":mobility<=6?"#f59e0b":"#10b981"} />
      </div>

      <div className="card">
        <div className="card-title"><span className="dot" style={{background:"var(--red)"}} />Symptômes de la Plaie</div>
        <div className="chips-grid">
          {woundOptions.map((o,i) => (
            <button key={o} className={`chip ${wound.includes(o)?"on":""}`} onClick={() => toggle(wound, setWound, o)}>
              {wound.includes(o) ? "✓ " : ""}{woundLabels[i]}
            </button>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="card-title"><span className="dot" style={{background:"var(--purple)"}} />Autres Symptômes</div>
        <div className="chips-grid">
          {otherOptions.map((o,i) => (
            <button key={o} className={`chip ${dangerIdx.includes(i)?"danger":""} ${other.includes(o)?"on":""}`} onClick={() => toggle(other, setOther, o)}>
              {other.includes(o) ? "✓ " : ""}{otherLabels[i]}
            </button>
          ))}
        </div>
      </div>

      <button className="btn btn-green" onClick={submit} disabled={loading}>
        {loading ? <><div className="spinner" /> Analyse en cours...</> : "📊 Analyser le Check-in"}
      </button>

      {error && (
        <div className="alert-card alert-CRITICAL" style={{marginTop:16}}>
          <div className="alert-icon">❌</div>
          <div className="alert-text">{error}</div>
        </div>
      )}

      {result && (
        <div style={{marginTop:24}}>
          <div className="card">
            <div style={{display:"flex",alignItems:"center",gap:24,marginBottom:20,paddingBottom:16,borderBottom:"1px solid var(--border)"}}>
              <ScoreRing value={result.recovery_score} />
              <div>
                <div style={{fontSize:22,fontWeight:800}}>Score de Récupération</div>
                <div style={{color:"var(--muted2)",marginTop:4}}>J+6 — Sarah Miller</div>
                <div style={{marginTop:12}}><span className={`status-badge status-${result.status}`}>
                  {result.status === "OK" && "✅ Tout va bien"}
                  {result.status === "WARNING" && "⚠️ Surveillance requise"}
                  {result.status === "EMERGENCY" && "🚨 URGENCE — Appelez le 15"}
                </span></div>
              </div>
            </div>

            {result.alerts.length > 0 && (
              <>
                <div className="section-title">Alertes</div>
                {result.alerts.map((a, i) => (
                  <div key={i} className={`alert-card alert-${a.severity}`}>
                    <div className="alert-icon">{a.severity === "EMERGENCY" ? "🚨" : "⚠️"}</div>
                    <div>
                      <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>[{a.severity}]</div>
                      <div className="alert-text">{a.message}</div>
                      <div style={{marginTop:6,fontSize:12,color:"var(--primary)"}}>→ Action: {a.action?.replace(/_/g," ")}</div>
                    </div>
                  </div>
                ))}
              </>
            )}

            {result.recommendations.length > 0 && (
              <>
                <div className="section-title">Recommandations</div>
                {result.recommendations.map((r,i) => (
                  <div key={i} className="restriction-item"><span>💡</span>{r}</div>
                ))}
              </>
            )}
          </div>
          <div className="card">
            <div className="card-title"><span className="dot" style={{background:"var(--purple)"}} />JSON Réponse</div>
            <JsonViewer data={result} />
          </div>
        </div>
      )}
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState(0);
  const [apiUrl, setApiUrl] = useState(API_DEFAULT);

  return (
    <div className="app">
      <div className="header">
        <div className="header-badge">⚕ SurgiGuard AI · D2A Test Lab</div>
        <h1>Pipeline <span>AI Médical</span><br/>Test Interface</h1>
        <p>Uploadez un PDF, analysez les données, testez les alertes de sécurité</p>
      </div>

      <div className="api-config">
        <div className="api-dot" />
        <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,whiteSpace:"nowrap"}}>API URL :</span>
        <input className="api-url-input" value={apiUrl} onChange={e => setApiUrl(e.target.value)} placeholder="http://localhost:8000" />
        <span style={{fontSize:11,color:"var(--green)",fontWeight:600}}>FastAPI</span>
      </div>

      <div className="tabs">
        <button className={`tab ${tab===0?"active":""}`} onClick={()=>setTab(0)}>📄 Upload Dossier PDF</button>
        <button className={`tab ${tab===1?"active":""}`} onClick={()=>setTab(1)}>🩺 Check-in Quotidien</button>
      </div>

      {tab === 0 && <UploadTab apiUrl={apiUrl} />}
      {tab === 1 && <CheckInTab apiUrl={apiUrl} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
