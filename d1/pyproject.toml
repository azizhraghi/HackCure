[project]
name = "surgiguard-d1"
version = "0.1.0"
description = "SurgiGuard AI - Developer 1: physiology, Recovery Twin, forecasting and CV"
requires-python = ">=3.11"
dependencies = ["numpy", "pydantic>=2", "scikit-learn", "joblib"]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["groq", "anthropic"]
neuro = ["mediapipe", "opencv-python-headless"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
